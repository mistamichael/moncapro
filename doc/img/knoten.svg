<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Open Sans', verdana, arial, sans-serif">
  <rect x="0" y="0" width="640" height="400" fill="rgb(255,255,255)"/>

  <!-- Normaler Knoten (links), Puffer > 0 -->
  <g transform="translate(40,60)">
    <rect x="0" y="0" width="220" height="175" fill="none" stroke="rgb(68,114,196)" stroke-width="2.5"/>
    <line x1="0" y1="50" x2="220" y2="50" stroke="rgb(68,114,196)" stroke-width="1.5"/>
    <line x1="0" y1="115" x2="220" y2="115" stroke="rgb(68,114,196)" stroke-width="1.5"/>
    <line x1="110" y1="50" x2="110" y2="175" stroke="rgb(68,114,196)" stroke-width="1.5"/>

    <text x="110" y="32" text-anchor="middle" font-size="15" fill="rgb(42,63,95)">Auswahl Tank-Lieferant</text>

    <text x="55" y="80" text-anchor="middle" font-size="18" font-weight="bold" fill="rgb(42,63,95)">FAZ</text>
    <text x="165" y="80" text-anchor="middle" font-size="18" font-weight="bold" fill="rgb(42,63,95)">FEZ</text>
    <text x="55" y="143" text-anchor="middle" font-size="18" font-weight="bold" fill="rgb(42,63,95)">SAZ</text>
    <text x="165" y="143" text-anchor="middle" font-size="18" font-weight="bold" fill="rgb(42,63,95)">SEZ</text>

    <text x="55" y="103" text-anchor="middle" font-size="15" fill="rgb(42,63,95)">10</text>
    <text x="165" y="103" text-anchor="middle" font-size="15" fill="rgb(42,63,95)">18</text>
    <text x="55" y="163" text-anchor="middle" font-size="15" fill="rgb(42,63,95)">27</text>
    <text x="165" y="163" text-anchor="middle" font-size="15" fill="rgb(42,63,95)">35</text>

    <text x="110" y="-10" text-anchor="middle" font-size="15" fill="rgb(68,114,196)">Dauer 8 Tage</text>
    <text x="110" y="210" text-anchor="middle" font-size="15" fill="rgb(68,114,196)">Puffer = SAZ - FAZ = 17 Tage</text>
  </g>

  <!-- Kritischer Knoten (rechts), Puffer = 0 -->
  <g transform="translate(360,60)">
    <rect x="0" y="0" width="220" height="175" fill="none" stroke="rgb(192,57,43)" stroke-width="2.5"/>
    <line x1="0" y1="50" x2="220" y2="50" stroke="rgb(192,57,43)" stroke-width="1.5"/>
    <line x1="0" y1="115" x2="220" y2="115" stroke="rgb(192,57,43)" stroke-width="1.5"/>
    <line x1="110" y1="50" x2="110" y2="175" stroke="rgb(192,57,43)" stroke-width="1.5"/>

    <text x="110" y="32" text-anchor="middle" font-size="16" fill="rgb(42,63,95)">Bau des Fundaments</text>

    <text x="55" y="80" text-anchor="middle" font-size="18" font-weight="bold" fill="rgb(42,63,95)">FAZ</text>
    <text x="165" y="80" text-anchor="middle" font-size="18" font-weight="bold" fill="rgb(42,63,95)">FEZ</text>
    <text x="55" y="143" text-anchor="middle" font-size="18" font-weight="bold" fill="rgb(42,63,95)">SAZ</text>
    <text x="165" y="143" text-anchor="middle" font-size="18" font-weight="bold" fill="rgb(42,63,95)">SEZ</text>

    <text x="55" y="103" text-anchor="middle" font-size="15" fill="rgb(42,63,95)">10</text>
    <text x="165" y="103" text-anchor="middle" font-size="15" fill="rgb(42,63,95)">35</text>
    <text x="55" y="163" text-anchor="middle" font-size="15" fill="rgb(42,63,95)">10</text>
    <text x="165" y="163" text-anchor="middle" font-size="15" fill="rgb(42,63,95)">35</text>

    <text x="110" y="-10" text-anchor="middle" font-size="15" fill="rgb(192,57,43)">Dauer 25 Tage</text>
    <text x="110" y="210" text-anchor="middle" font-size="15" fill="rgb(192,57,43)">Puffer = SAZ - FAZ = 0 Tage (kritisch)</text>
  </g>

  <!-- Pfeil zwischen den Knoten -->
  <line x1="260" y1="147" x2="358" y2="147" stroke="rgb(100,100,100)" stroke-width="2"/>
  <polygon points="358,147 348,142 348,152" fill="rgb(100,100,100)"/>

  <text x="320" y="325" text-anchor="middle" font-size="13" fill="rgb(100,100,100)">Beide Vorgänge folgen auf „Entwurf des Tanks“ (FEZ 10 = FAZ 10)</text>
</svg>
